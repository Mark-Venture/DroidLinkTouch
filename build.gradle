// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // When building inside OneDrive on Windows, redirect build directory to avoid file-lock conflicts with sync
    if (System.getProperty("os.name").toLowerCase().contains("windows") && rootDir.absolutePath.toLowerCase().contains("onedrive")) {
        def userHome = System.getProperty("user.home").replace('\\', '/')
        layout.buildDirectory.set(file("${userHome}/.builds/DroidLinkTouch/${project.name}"))
    }
}
